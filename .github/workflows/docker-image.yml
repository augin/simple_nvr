name: Docker Image CI

on:
  push:
    tags:
      - 'v*'

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ github.repository }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}},enable=false
          type=match,pattern=v(.*),group=1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: |
          linux/amd64
          linux/arm/v7
          linux/arm64/v8
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Configure SSH key
      if: github.event_name != 'pull_request'
      env:
        SSH_KEY: ${{ secrets.HA_ADDONS_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Update HA addons config.yaml version
      if: github.event_name != 'pull_request'
      run: |
        git clone git@github.com:augin/ha_addons.git
        cd ha_addons/simple_nvr
        sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}/" config.yaml
        git config user.email "ci-bot@augin.ru"
        git config user.name "CI Bot"
        git add config.yaml
        git commit -m "v${{ steps.version.outputs.VERSION }}: update NVR addon version"
        git push origin main
