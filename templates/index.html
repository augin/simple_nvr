<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple NVR</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-brand">Simple NVR <span class="version-pill" id="version-pill">dev</span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('cameras')">Камеры</button>
      <button class="nav-tab" onclick="switchTab('archive')">Архив</button>
      <button class="nav-tab" onclick="switchTab('monitoring')">Мониторинг</button>
      <button class="nav-tab" onclick="switchTab('alarm')">Тревога</button>
      <button class="nav-tab" onclick="switchTab('settings')">Настройки</button>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()" title="Переключить тему">◐</button>
  </nav>

  <main class="main">
    <section id="tab-cameras" class="tab-content active">
      <div class="layout">
        <div class="sidebar">
          <div class="card">
            <div class="card-header">
              <h3>Камеры</h3>
              <div class="recording-indicator" id="recording-indicator" style="display:none;">
                <span class="led led-red"></span> Запись
              </div>
            </div>
            <div class="card-body">
              <div id="camera-list" class="camera-list"></div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3>Хранилище</h3>
            </div>
            <div class="card-body">
              <div id="storage-info" class="storage-info"></div>
            </div>
          </div>
        </div>

        <div class="content">
          <div class="content-columns">
            <div class="card video-card">
              <div class="card-header">
                <h3 id="current-camera">Выберите камеру</h3>
              </div>
              <div class="card-body">
                <div class="video-wrapper">
                  <video id="video-player" controls muted></video>
                </div>
                <div class="controls-row">
                  <div class="speed-controls">
                    <button class="btn btn-sm" onclick="setSpeed(1)" data-speed="1">1x</button>
                    <button class="btn btn-sm" onclick="setSpeed(2)" data-speed="2">2x</button>
                    <button class="btn btn-sm" onclick="setSpeed(4)" data-speed="4">4x</button>
                    <button class="btn btn-sm" onclick="setSpeed(8)" data-speed="8">8x</button>
                    <button class="btn btn-sm" onclick="setSpeed(10)" data-speed="10">10x</button>
                  </div>
                  <div class="download-controls">
                    <input type="time" id="dl-from" step="1" value="00:00:00" class="form-input form-input-sm">
                    <span class="dl-sep">—</span>
                    <input type="time" id="dl-to" step="1" value="00:00:00" class="form-input form-input-sm">
                    <button class="btn btn-sm btn-primary" onclick="downloadClip()">↓ Скачать</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="card files-card">
              <div class="card-header">
                <h3>Записи</h3>
              </div>
              <div class="card-body">
                <div id="file-tree" class="file-tree"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-archive" class="tab-content">
      <div class="layout">
        <div class="sidebar">
          <div class="card">
            <div class="card-header">
              <h3>Камеры</h3>
            </div>
            <div class="card-body">
              <div id="archive-camera-list" class="camera-list"></div>
            </div>
          </div>
        </div>

        <div class="content">
          <div class="content-columns">
            <div class="card video-card">
              <div class="card-header">
                <h3 id="archive-current-camera">Выберите камеру</h3>
              </div>
              <div class="card-body">
                <div class="video-wrapper">
                  <video id="archive-video-player" controls muted></video>
                </div>
                <div class="controls-row">
                  <div class="speed-controls">
                    <button class="btn btn-sm" onclick="setArchiveSpeed(1)" data-speed="1">1x</button>
                    <button class="btn btn-sm" onclick="setArchiveSpeed(2)" data-speed="2">2x</button>
                    <button class="btn btn-sm" onclick="setArchiveSpeed(4)" data-speed="4">4x</button>
                    <button class="btn btn-sm" onclick="setArchiveSpeed(8)" data-speed="8">8x</button>
                    <button class="btn btn-sm" onclick="setArchiveSpeed(10)" data-speed="10">10x</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="card files-card">
              <div class="card-header">
                <h3>Архивные записи</h3>
              </div>
              <div class="card-body">
                <div id="archive-file-tree" class="file-tree"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-monitoring" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h3>Процессы записи</h3>
          <div class="recording-indicator" id="monitoring-indicator" style="display:none;">
            <span class="led led-red"></span> Запись активна
          </div>
        </div>
        <div class="card-body">
          <div id="monitoring-processes" class="monitoring-processes"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>Хранилище</h3>
        </div>
        <div class="card-body">
          <div id="monitoring-storage" class="storage-info"></div>
        </div>
      </div>
    </section>

    <section id="tab-alarm" class="tab-content">
      <div class="card">
        <div class="card-header">
          <h3>Alarm Server</h3>
          <label class="toggle">
            <input type="checkbox" id="alarm-toggle" onchange="toggleAlarm()">
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="card-body">
          <div class="alarm-info">
            <span id="alarm-port-info"></span>
            <span id="alarm-mqtt-info"></span>
            <span id="alarm-events-info"></span>
          </div>
        </div>
      </div>

      <div class="card alarm-log-card">
        <div class="card-header">
          <h3>События</h3>
          <button class="btn btn-sm" onclick="clearAlarmLog()">Очистить</button>
        </div>
        <div class="card-body">
          <div id="alarm-log" class="alarm-log"></div>
        </div>
      </div>
    </section>

    <section id="tab-settings" class="tab-content">
      <div class="sub-tabs">
        <button class="sub-tab active" onclick="switchSubTab('main')">Основные</button>
        <button class="sub-tab" onclick="switchSubTab('limits')">Лимиты по камерам</button>
      </div>

      <div id="subtab-main" class="sub-tab-content active">
        <div class="card">
          <div class="card-header">
            <h3>Настройки</h3>
          </div>
          <div class="card-body">
            <form id="settings-form" class="grid-form" onsubmit="saveSettings(event)">
              <div class="form-group">
                <label for="base_dir">Директория хранения</label>
                <input type="text" id="base_dir" name="base_dir" class="form-input">
              </div>
              <div class="form-group">
                <label for="archive_dir">Директория архива</label>
                <input type="text" id="archive_dir" name="archive_dir" class="form-input">
              </div>
              <div class="form-group">
                <label for="stream_server">RTSP сервер</label>
                <input type="text" id="stream_server" name="stream_server" class="form-input">
              </div>
              <div class="form-group">
                <label for="default_camera_limit_gb">Лимит на камеру по умолчанию (ГБ)</label>
                <input type="number" id="default_camera_limit_gb" name="default_camera_limit_gb" class="form-input">
              </div>
              <div class="form-group">
                <label for="global_size_gb">Глобальный лимит (ГБ, 0 = без лимита)</label>
                <input type="number" id="global_size_gb" name="global_size_gb" class="form-input">
              </div>
              <div class="form-group">
                <label for="go2rtc_config_path">Путь к go2rtc.yaml</label>
                <input type="text" id="go2rtc_config_path" name="go2rtc_config_path" class="form-input">
              </div>
              <div class="form-group">
                <label for="http_port">Порт HTTP</label>
                <input type="number" id="http_port" name="http_port" class="form-input">
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div id="subtab-limits" class="sub-tab-content">
        <div class="card">
          <div class="card-header">
            <h3>Лимиты по камерам</h3>
            <span class="text-muted">Лимит по умолчанию: <span id="limits-default-camera">90</span> ГБ | Глобальный: <span id="limits-global-target">500</span> ГБ</span>
          </div>
          <div class="card-body">
            <div id="camera-limits-list"></div>
            <div class="form-actions">
              <button type="button" class="btn btn-primary" onclick="saveCameraLimits()">Сохранить</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/js/app.js"></script>
</body>
</html>
